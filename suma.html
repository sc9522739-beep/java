<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>OPERACIONES BASICAS</h1>
    <script>
        let N1=Number(prompt(`introduce el primer número`));
        let N2=Number(prompt(`introduce el segundo número`));
        suma= N1 + N2
        document.write ("El valor de la suma  es:"+suma+"<br>")
        resta= N1 - N2
        document.write ("El valor de la resta es:"+resta+"<br>")
        multiplicacion= N1 * N2
        document.write ("El valor de la multiplicacion es:"+multiplicacion+"<br>")
        division= N1 / N2
        document.write ("El valor de la division es:"+division+"<br>")

    </script>
</script>
</body>
</html>
