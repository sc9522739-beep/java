<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for ( i = 1; i <= 5; i++) {
            document.write("Mi nombre es Sofia");
            document.write("<br>");
        }
       
        
        for ( i = 1; i <= 100; i++) {
            document.write("i");
        }
        for (i = 100; i >= 1; i--) {
            document.write("i");
        }
    </script>
    

</body>
</html>
