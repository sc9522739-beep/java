<body>

<script>
    alert("Tu signo zodiacal");

    let mes = Number(prompt(
        "Elige tu mes de nacimiento:\n" +
        "1 - Enero\n" +
        "2 - Febrero\n" +
        "3 - Marzo\n" +
        "4 - Abril\n" +
        "5 - Mayo\n" +
        "6 - Junio\n" +
        "7 - Julio\n" +
        "8 - Agosto\n" +
        "9 - Septiembre\n" +
        "10 - Octubre\n" +
        "11 - Noviembre\n" +
        "12 - Diciembre"
    ));

    switch (mes) {
        case 1:
            alert("Tu signo es Capricornio");
            break;

        case 2:
            alert("Tu signo es Acuario");
            break;

        case 3:
            alert("Tu signo es Piscis");
            break;

        case 4:
            alert("Tu signo es Aries");
            break;

        case 5:
            alert("Tu signo es Tauro");
            break;

        case 6:
            alert("Tu signo es Géminis");
            break;

        case 7:
            alert("Tu signo es Cáncer");
            break;

        case 8:
            alert("Tu signo es Leo");
            break;

        case 9:
            alert("Tu signo es Virgo");
            break;

        case 10:
            alert("Tu signo es Libra");
            break;

        case 11:
            alert("Tu signo es Escorpio");
            break;

        case 12:
            alert("Tu signo es Sagitario");
            break;

        default:
            alert("Ese mes no existe");
    }
</script>
