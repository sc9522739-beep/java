<body>
  <script>
alert("Tu promedio");

let cali1 = Number(prompt("Primera calificación"));
let cali2 = Number(prompt("Segunda calificación"));
let cali3 = Number(prompt("Tercera calificación"));

let promedio = (cali1 + cali2 + cali3) / 3;

if (promedio >= 6) {
    alert("Aprobaste el semestre. Promedio: " + promedio);
} else {
    alert("Reprobaste el semestre. Promedio: " + promedio);
}
</script>
  </script>  
</body>
</html>
